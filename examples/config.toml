# Client-side herdr config for herdr-attention-queue. The plugin reports tokens
# and an Agents view; how rows look and which keys invoke actions is config on
# the machine running the herdr client. Merge into ~/.config/herdr/config.toml,
# then `herdr server reload-config` (or the UI's reload config action).

[ui]
# With every server on herdr 0.9.1+ and the plugin installed, the selected
# machine's view orders every machine's agents together, so this setting only
# applies during brief fallbacks (a machine reconnecting). "spaces" is the
# fallback that never reorders rows when you click one.
agent_panel_sort = "spaces"
# The notifier finds the Ghostty terminal running the herdr client by this
# title prefix ("herdr "). Set the same on every server you connect to.
window_title = "herdr {hostname}: {workspace}"

[ui.sidebar.agents]
# One line per agent: the state icon and where the agent is, coloured by
# state, then the Claude usage window closest to its cap. Its leading icon names
# the window (5-hour block \U000F0954, 7-day window \U000F00ED, model cap
# \U000F0068, extra spend \U000F0114); a trailing badge marks a problem, and
# colours it: warn (nearing the cap) \U000F0026, critical (about to hit it)
# \U000F0029. Green without a badge.
# $attn_row is "<icon> <place>" as one token, because herdr
# puts " · " between any two row tokens except after its own state_icon.
# Display rules style a token by its own value, so they match the leading glyph
# (Nerd Font, written as escapes):
#   blocked \uf06a  done \uf058  working \uf144  waiting \uf252  idle \uf10c
#   unknown \uf059
# ($attn_icon is the glyph alone, for a layout that keeps "workspace" separate.)
# state_icon is left out: it shows herdr's own status, which reads idle for an
# agent the plugin keeps done.
rows = [
  [{ token = "$attn_row", rules = [
    { starts_with = "\uf06a", fg = "#cc6666", bold = true },
    { starts_with = "\uf058", fg = "#a78300", bold = true },
    { starts_with = "\uf144", fg = "#428b00" },
    { starts_with = "\uf252", fg = "#0072d4" },
    { starts_with = "\uf10c", dim = true },
    { starts_with = "\uf059", dim = true },
  ] }, { token = "$usage", fg = "#428b00", dim = true, rules = [
    { contains = "\U000F0029", fg = "#cc6666", bold = true, dim = false },
    { contains = "\U000F0026", fg = "#a78300", dim = false },
  ] }],
]

[keys]
prefix = "ctrl+b"
# Focus the Nth agent of the combined list, across machines. The notifier
# sends this key to switch the client to another machine on a click.
focus_agent = "prefix+alt+1..9"

# Ctrl-b Enter: highest-priority actionable agent on the selected server.
# Stay until acted on; focus never acknowledges. Indexed focus spans machines.
[[keys.command]]
key = "prefix+enter"
type = "plugin_action"
command = "attention-queue.jump-attention"
description = "attention: highest-priority agent (this server)"

# Actions run against the focused pane. Carry the same bindings in the config of
# every herdr server you connect to as a machine.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "attention-queue.mark-reviewed"
description = "attention: mark agent reviewed"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "attention-queue.mark-all-reviewed"
description = "attention: mark all agents reviewed"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "attention-queue.mark-unread"
description = "attention: mark agent done"
